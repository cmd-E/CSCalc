apply plugin: 'com.android.application'
apply plugin: 'jacoco'

android {
    namespace 'com.dbuster.cscalculator'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.dbuster.cscalculator"
        minSdkVersion 22
        targetSdkVersion 29
        versionCode 1
        versionName '1.4'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

jacoco {
    toolVersion = '0.8.14'
}

def coreClasses = fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) {
    include 'com/dbuster/cscalculator/GradeCalculator*.class'
}
tasks.withType(Test).configureEach {
    jacoco.destinationFile = layout.buildDirectory.file("jacoco/${name}.exec").get().asFile
}
def coverageData = layout.buildDirectory.file('jacoco/testDebugUnitTest.exec')

tasks.register('coreCoverageReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    classDirectories.setFrom(coreClasses)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(coverageData)
    reports {
        xml.required = true
        html.required = true
    }
    doFirst {
        if (coreClasses.isEmpty() || !coverageData.get().asFile.isFile()) {
            throw new GradleException('Core classes or unit-test coverage data are missing')
        }
    }
}

tasks.register('coreCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'coreCoverageReport'
    classDirectories.setFrom(coreClasses)
    executionData.setFrom(coverageData)
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 1.0 }
            limit { counter = 'BRANCH'; minimum = 1.0 }
        }
    }
}
